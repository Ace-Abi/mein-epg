
name: EPG automatisch aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3,15 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: EPG zusammenstellen
        run: python build_epg.py
      - name: Änderungen veröffentlichen
        run: |
          git config user.name "epg-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml epg.xml.gz zuordnung.txt
          git diff --cached --quiet || (git commit -m "Automatisches EPG Update" && git push)
  
